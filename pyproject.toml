[tool.poetry]
authors = ["Tomas Beuzen"]
description = "Calculate word counts in a text file!"
license = "MIT"
name = "pycounts"
readme = "README.md"
version = "0.1.0"

[tool.poetry.dependencies]
matplotlib = ">=3.10"
python = "^3.12"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[dependency-groups]
dev = [
  "pytest (>=9.0.2,<10.0.0)",
  "pytest-cov (>=7.0.0,<8.0.0)",
  "myst-nb (>=1.4.0,<2.0.0) ; python_version >= \"3.9\" and python_version < \"4.0\"",
  "sphinx-autoapi (>=3.8.0,<4.0.0)",
  "sphinx-rtd-theme (>=3.1.0,<4.0.0)",
]
